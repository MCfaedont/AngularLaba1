<h3>Table students</h3>

<div class="main-table">

    <table mat-table [dataSource]="(baseService.studentsSubject | async) || []">

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef style="width: 70px;"> ID </th>
            <td mat-cell *matCellDef="let student"> {{student.id}}</td>
        </ng-container>


        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef style="width: 200px;"> Name </th>
            <td mat-cell *matCellDef="let student"> {{student.name}}</td>
        </ng-container>

        <ng-container matColumnDef="surname">
            <th mat-header-cell *matHeaderCellDef style="width: 240px;"> SurName </th>
            <td mat-cell *matCellDef="let student"> {{student.surname}}</td>
        </ng-container>

        <ng-container matColumnDef="options">
            <th mat-header-cell *matHeaderCellDef style="width: 30px;">vsg</th>
            <td mat-cell *matCellDef="let student; let i = index" style="display: flex;">
                <button class="edit-stud-button" (click)='OnEditStudentClicked(i)'> Edit </button>
                <button class="delete-stud-button" (click)='OnDeleteStudentClicked(student, i)'>Del {{i}}</button>
            </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <div class="buttonsadd">         
        <button class="add-student-button" (click)='OnAddNewStudentClicked()'>Add</button>     
    </div>
</div>
