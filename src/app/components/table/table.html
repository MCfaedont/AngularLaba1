<h3>Table students</h3>
<h1>-there are table data about all students</h1>
<div class="main-table">

     

    <table>
        <colgroup>
            <col style="width: 70px;">
            <col style="width: 200px;">
            <col style="width: 240px;">
            <col style="width: 30px;">
        </colgroup>
        <thead>
            <th>Id</th>
            <th>Name</th>
            <th>Surname</th>
            <th>Options</th>
        </thead>
        <tbody>
        <tr *ngFor="let student of baseService.studentsSubject | async; let i = index">
            <td>{{student.id}}</td>
            <td>{{student.name}}</td>
            <td>{{student.surname}}</td>
            <td style="display: flex;">
                <button class="edit-student-button" (click) = 'OnEditStudentClicked(i)'> Edit </button>
                <button class="delete-student-button" (click) = 'OnDeleteStudentClicked(student, i)'>Del {{i}} </button>
            </td>
           
        </tr>
        </tbody>
    </table>

    <div class="buttonsadd">
    
        <button class="add-student-button" (click)='OnAddNewStudentClicked()'>Add</button>
        
    </div>

</div>
