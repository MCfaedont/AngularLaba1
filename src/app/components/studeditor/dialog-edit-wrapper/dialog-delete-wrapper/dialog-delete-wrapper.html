<h1 mat-dialog-title>Enter id for deleting student</h1>

<div mat-dialog-content style="display: inline; padding: 2px; margin: auto;">

    <mat-form-field class="full-width-input">

    <input matInput type="number" placeholder="Enter student ID"
    [(ngModel)]="studentId" required>

    </mat-form-field>
</div>

<div mat-dialog-actions>

    <button mat-raised-button (click)="onNoClick()">Cancel</button>
    <button class="right-align" mat-raised-button
    [mat-dialog-close]="{ id: studentId }">Delete</button>

</div>
